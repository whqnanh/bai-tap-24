<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLantern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="50%" stop-color="#4a0404" />
      <stop offset="100%" stop-color="#150202" />
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fb8500" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d00000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadowL">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#ffb703" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgLantern)"/>

  <!-- Ambient Golden Glow -->
  <circle cx="400" cy="270" r="220" fill="url(#glowG)"/>

  <!-- Badge -->
  <rect x="40" y="30" width="260" height="32" rx="16" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="170" y="51" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HIỆU ỨNG JAVASCRIPT NÂNG CAO</text>

  <!-- Title -->
  <text x="40" y="95" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Đèn Kéo Quân 3D — Lồng Đèn Xoay 6 Mặt</text>
  <text x="40" y="125" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">6 Hình ảnh cá nhân • Tự động quay 360° • Rê chuột vào DỪNG LẠI • Rê chuột ra QUAY TIẾP</text>

  <!-- Stylized Lantern Graphic -->
  <g transform="translate(400, 270)" filter="url(#shadowL)">
    <!-- Hanging cord -->
    <line x1="0" y1="-170" x2="0" y2="-110" stroke="#f59e0b" stroke-width="3"/>

    <!-- Lantern Top Cap (Mái đình) -->
    <path d="M-130 -100 L130 -100 L90 -120 L-90 -120 Z" fill="#b91c1c" stroke="#f59e0b" stroke-width="2"/>
    <path d="M-140 -90 Q-150 -105 -130 -100 Q0 -115 130 -100 Q150 -105 140 -90 Z" fill="#dc2626" stroke="#fbbf24" stroke-width="2"/>

    <!-- Center lantern core flame -->
    <ellipse cx="0" cy="10" rx="30" ry="70" fill="#fff" opacity="0.8"/>
    <ellipse cx="0" cy="10" rx="45" ry="90" fill="#fbbf24" opacity="0.6"/>

    <!-- 3D Faces Perspective representation -->
    <!-- Left Face -->
    <polygon points="-120,-80 -40,-70 -40,90 -120,80" fill="#7f1d1d" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
    <!-- Center Face (Front) -->
    <polygon points="-40,-70 40,-70 40,90 -40,90" fill="#991b1b" stroke="#fde047" stroke-width="2.5"/>
    <rect x="-30" y="-55" width="60" height="120" rx="4" fill="#fbbf24" opacity="0.25"/>
    <text x="0" y="10" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ẢNH 1</text>
    <text x="0" y="28" fill="#fde047" font-family="sans-serif" font-size="9" text-anchor="middle">Nguyễn Hoàng Anh</text>

    <!-- Right Face -->
    <polygon points="40,-70 120,-80 120,80 40,90" fill="#7f1d1d" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>

    <!-- Lantern Bottom Cap -->
    <path d="M-110 90 L110 90 L80 115 L-80 115 Z" fill="#b91c1c" stroke="#f59e0b" stroke-width="2"/>

    <!-- Hanging Red Tassels (Tua rua) -->
    <g stroke="#ef4444" stroke-width="3">
      <line x1="0" y1="115" x2="0" y2="160"/>
      <line x1="-50" y1="110" x2="-50" y2="150"/>
      <line x1="50" y1="110" x2="50" y2="150"/>
    </g>
    <circle cx="0" cy="165" r="5" fill="#f59e0b"/>
    <circle cx="-50" cy="155" r="4" fill="#f59e0b"/>
    <circle cx="50" cy="155" r="4" fill="#f59e0b"/>

    <!-- Interactive hover badge -->
    <g transform="translate(160, -40)">
      <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="12" y="20" fill="#fde047" font-family="sans-serif" font-size="12" font-weight="bold">🖱️ Rê chuột: DỪNG LẠI</text>
      <text x="12" y="34" fill="#cbd5e1" font-family="sans-serif" font-size="11">Rời chuột: QUAY TIẾP</text>
    </g>
  </g>
</svg>